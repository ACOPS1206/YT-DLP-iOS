name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          choices = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              tool = app / 'Contents/Developer/usr/bin/xcodebuild'
              text = subprocess.check_output([str(tool), '-version'], text=True)
              match = re.search(r'Xcode (\d+(?:\.\d+)*)', text)
              version = tuple(map(int, match[1].split('.')))
              if version[0] >= 26:
                  choices.append((version, str(app / 'Contents/Developer')))
          if not choices:
              raise SystemExit('This runner needs Xcode 26+. Choose a newer macOS runner image.')
          subprocess.run(['sudo', 'xcode-select', '-s', max(choices)[1]], check=True)
          PY
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project generator
        run: brew install xcodegen
      - name: Fetch dependencies and generate project
        run: python3 tools/bootstrap.py
      - name: Python integration tests
        run: PYTHONPATH=Python/app python3 -m unittest discover -s tests -v
      - name: Build device app
        run: |
          xcodebuild -project YTDLPGUI.xcodeproj -scheme YTDLPGUI \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          test -d build/device/Build/Products/Release-iphoneos/YTDLPGUI.app/PlugIns/ShareExtension.appex
          test -d build/device/Build/Products/Release-iphoneos/YTDLPGUI.app/PlugIns/LiveActivityExtension.appex
          mkdir -p build/ipa/Payload
          ditto build/device/Build/Products/Release-iphoneos/YTDLPGUI.app build/ipa/Payload/YTDLPGUI.app
          cd build/ipa
          zip -qr ../yt-dlp-GUI-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-GUI-unsigned-IPA
          path: build/yt-dlp-GUI-unsigned.ipa
          retention-days: 14
      - name: Build simulator app
        run: |
          xcodebuild -project YTDLPGUI.xcodeproj -scheme YTDLPGUI \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Test sharing and Live Activity data on simulator
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))
          candidates = []
          for runtime, rows in devices['devices'].items():
              match = re.search(r'iOS-(\d+)', runtime)
              if match and int(match[1]) >= 26:
                  candidates.extend(row['udid'] for row in rows if row.get('isAvailable', True) and row['name'].startswith('iPhone'))
          if not candidates:
              raise SystemExit('An iOS 26+ simulator runtime is needed for native tests.')
          subprocess.run(['xcodebuild', '-project', 'YTDLPGUI.xcodeproj', '-scheme', 'YTDLPGUI',
                          '-configuration', 'Debug', '-destination', 'platform=iOS Simulator,id=' + candidates[0],
                          '-derivedDataPath', 'build/simulator', 'CODE_SIGNING_ALLOWED=NO',
                          'ARCHS=arm64', 'ONLY_ACTIVE_ARCH=YES', 'test'], check=True)
          PY
